# fly.toml app configuration file generated for ShadowDiff
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "shadowdiff"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DEMO_MODE = "true"
  AUTO_TRAFFIC = "true"
  SAFE_MODE_ONLY = "false"
  FLOAT_TOLERANCE = "0.000001"
  GEMINI_MODEL = "gemini-2.0-flash"
  REDACT_PII = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
