# ShadowDiff Configuration Example
proxy_port: ":8080"
dashboard_port: ":8083"

# Upstream targets
primary_url: "https://legacy-api.internal"
shadow_url: "https://ai-refactored-api.internal"

# Security and traffic routing
safe_mode_only: false       # If true, only GET and HEAD requests are shadowed
float_tolerance: 0.000001    # Numeric drift threshold

# Non-deterministic fields to suppress
ignore_paths:
  - "timestamp"
  - "created_at"
  - "updated_at"
  - "uuid"
  - "trace_id"
  - "nonce"

# Headers to ignore in diffing
ignore_headers:
  - "date"
  - "server"
  - "x-request-id"
  - "set-cookie"
  - "content-length"

# AI Regression Generator
ai_provider: "auto"              # "auto", "gemini", "ollama", "offline"
gemini_model: "gemini-2.0-flash"
ollama_url: "http://localhost:11434"
ollama_model: "llama3.3"         # llama3.3, deepseek-r1:8b, qwen2.5-coder
auto_generate_test: true

# Enterprise Security & Compliance
enable_pii_redaction: true       # Masks Credit Cards, SSNs, Emails, Phones, JWTs, API Keys
